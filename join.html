<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join - ESEN Events & Clubs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Mouse+Memoirs&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            montserrat: ['Montserrat', 'sans-serif']
          }
        }
      }
    };
  </script>

</head>
<body class="bg-gray-100 text-blue-900 font-montserrat">

  <!-- Navbar -->
<header class="bg-blue-900 text-white shadow">
  <div class="max-w-7xl mx-auto flex justify-between items-center p-4">
    <h1 class="text-2xl font-bold">ESEN Events & Clubs</h1>

    <!-- 🔽 Burger Button (mobile only) -->
    <button id="menu-toggle" class="block md:hidden text-white focus:outline-none">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>


    <!-- 🔷 Nav Links -->
    <nav id="menu" class="hidden md:flex space-x-4 text-sm md:text-base">
      <a href="index.html" class="hover:text-yellow-400">Home</a>
      <a href="events.html" class="hover:text-yellow-400">Events</a>
      <a href="clubs.html" class="hover:text-yellow-400">Clubs</a>
      <a href="join.html" class="hover:text-yellow-400">Join</a>
    </nav>
  </div>

  <!-- 🔽 Mobile Menu (hidden by default) -->
  <div id="mobile-menu" class="md:hidden hidden bg-blue-800 px-4 pb-4 space-y-2">
    <a href="index.html" class="block hover:text-yellow-400">Home</a>
    <a href="events.html" class="block hover:text-yellow-400">Events</a>
    <a href="clubs.html" class="block hover:text-yellow-400">Clubs</a>
    <a href="join.html" class="block hover:text-yellow-400">Join</a>
  </div>
</header>

  <!-- Join Form -->
  <section class="max-w-2xl mx-auto py-12 px-4">
    <h2 class="text-3xl font-bold text-center mb-8">Get Involved</h2>
    <form class="bg-white p-6 rounded-lg shadow space-y-4">
      <div>
        <label for="name" class="block mb-1 font-semibold">Full Name</label>
        <input type="text" id="name" class="w-full border border-gray-300 rounded px-3 py-2" placeholder="John Doe" />
      </div>
      <div>
        <label for="email" class="block mb-1 font-semibold">Email</label>
        <input type="email" id="email" class="w-full border border-gray-300 rounded px-3 py-2" placeholder="john.doe@example.com" />
      </div>
      <div>
        <label for="club" class="block mb-1 font-semibold">Interested Club</label>
        <select id="club" class="w-full border border-gray-300 rounded px-3 py-2">
            <option value="" disabled selected>Select a club</option>
            <option>EduTech</option>
            <option>ESEN Music</option>
            <option>ESEN United Nations Model</option>
            <option>Girl Up</option>
            <option>HOPE</option>
            <option>Pasitos</option>
            <option>ProBecas</option>
            <option>Rotaract</option>
            <option>Student Entrepreneur Society</option>
            <option>TECHO</option>
        </select>
      </div>
      <div>
        <label for="message" class="block mb-1 font-semibold">Why do you want to join?</label>
        <textarea id="message" rows="4" class="w-full border border-gray-300 rounded px-3 py-2" placeholder="Explain briefly why do you want to join this club."></textarea>
      </div>
      <button type="submit" class="bg-yellow-400 text-blue-900 font-bold py-2 px-6 rounded hover:bg-yellow-300 w-full transition">
        Submit
      </button>
    </form>
  </section>

  <footer class="bg-blue-900 text-white text-center py-6">
    <p>© 2025 ESEN Events & Clubs. All rights reserved.</p>
  </footer>


  <script src="js/script.js"></script>


</body>
</html>
